<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#1a5fb4"/>
    </marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Chit Chat — sequence of RPC calls with Lamport timestamps</text>
  <text x="430" y="48" text-anchor="middle" font-size="12" fill="#444">Scenario: Alice &amp; Bob join, exchange two messages, Bob leaves</text>

  <!-- Participant lifelines -->
  <g font-size="13" font-weight="bold" fill="#111">
    <rect x="80"  y="66" width="90" height="26" rx="4" fill="#e7f0fd" stroke="#1a5fb4"/>
    <text x="125" y="84" text-anchor="middle">Client A (Alice)</text>
    <rect x="385" y="66" width="90" height="26" rx="4" fill="#fdf0e0" stroke="#b5651d"/>
    <text x="430" y="84" text-anchor="middle">Service (Srv)</text>
    <rect x="690" y="66" width="90" height="26" rx="4" fill="#e9f7ee" stroke="#2e7d32"/>
    <text x="735" y="84" text-anchor="middle">Client B (Bob)</text>
  </g>

  <!-- Dashed lifelines -->
  <g stroke="#999" stroke-dasharray="5 4" stroke-width="1">
    <line x1="125" y1="92" x2="125" y2="620"/>
    <line x1="430" y1="92" x2="430" y2="620"/>
    <line x1="735" y1="92" x2="735" y2="620"/>
  </g>

  <!-- Arrows -->
  <g stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#arr)" font-size="12" fill="#111">
    <!-- 1. Alice Join -->
    <line x1="125" y1="130" x2="428" y2="130"/>
    <text x="135" y="122">1. Join(name="Alice")</text>
    <!-- 2. Srv broadcasts join (to both) -->
    <line x1="430" y1="170" x2="127" y2="170" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="150" y="162" fill="#8a5a00">2. broadcast JOIN — "Alice joined … time 1" (L=1)</text>
    <line x1="430" y1="196" x2="733" y2="196" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="540" y="188" fill="#8a5a00">2. broadcast JOIN (L=1)</text>

    <!-- 3. Bob Join -->
    <line x1="735" y1="238" x2="432" y2="238"/>
    <text x="540" y="230">3. Join(name="Bob")</text>
    <!-- 4. Srv broadcasts join (to both incl Bob) -->
    <line x1="430" y1="278" x2="127" y2="278" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="150" y="270" fill="#8a5a00">4. broadcast JOIN — "Bob joined … time 3" (L=3)</text>
    <line x1="430" y1="304" x2="733" y2="304" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="540" y="296" fill="#8a5a00">4. broadcast JOIN (L=3)</text>

    <!-- 5. Alice Publish -->
    <line x1="125" y1="346" x2="428" y2="346"/>
    <text x="135" y="338">5. Publish(msg="hello", lamport=3)</text>
    <!-- 6. Srv broadcasts chat -->
    <line x1="430" y1="386" x2="127" y2="386" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="150" y="378" fill="#8a5a00">6. broadcast CHAT — "Alice: hello" (L=4)</text>
    <line x1="430" y1="412" x2="733" y2="412" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="540" y="404" fill="#8a5a00">6. broadcast CHAT (L=4)</text>

    <!-- 7. Bob Publish -->
    <line x1="735" y1="454" x2="432" y2="454"/>
    <text x="540" y="446">7. Publish(msg="hi", lamport=4)</text>
    <!-- 8. Srv broadcasts chat -->
    <line x1="430" y1="494" x2="127" y2="494" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="150" y="486" fill="#8a5a00">8. broadcast CHAT — "Bob: hi" (L=5)</text>
    <line x1="430" y1="520" x2="733" y2="520" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="540" y="512" fill="#8a5a00">8. broadcast CHAT (L=5)</text>

    <!-- 9. Bob Leave -->
    <line x1="735" y1="562" x2="432" y2="562"/>
    <text x="540" y="554">9. Leave(name="Bob", lamport=5)</text>
    <!-- 10. Srv broadcasts leave (to remaining = Alice only) -->
    <line x1="430" y1="600" x2="127" y2="600" marker-end="url(#arrd)" stroke="#8a5a00"/>
    <text x="150" y="592" fill="#8a5a00">10. broadcast LEAVE — "Bob left … time 6" (L=6) → Alice only</text>
  </g>

  <!-- Small self-note under service clock progression -->
  <text x="430" y="632" text-anchor="middle" font-size="11" fill="#555">Service Lamport clock: 0 → 1 → 3 → 4 → 5 → 6   (each event: T = max(local, carried) + 1)</text>
</svg>
